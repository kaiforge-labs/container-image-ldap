name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ldap-debian:test

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck -x scripts/* tests/*.sh tests/fixtures/*.sh tests/integration/*.sh
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.IMAGE }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Vulnerability-Scan (Grype)
        uses: anchore/scan-action@v7
        with:
          sbom: sbom.spdx.json
          severity-cutoff: high
          only-fixed: true
          fail-build: true

  discover:
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          echo "tests=$(ls tests/integration/*.sh | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  integration:
    needs: [build, discover]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover.outputs.tests) }}
    name: test (${{ matrix.test }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - run: tests/fixtures/gen-certs.sh
      - run: bash "tests/integration/${{ matrix.test }}"
